apiVersion: v1
kind: Pod
metadata:
  name: safe-pod
  namespace: safe-ns          # victim namespace, isolated from the attacker
spec:
  nodeName: k8s-w2             # worker separate from the attacker's worker
  # -> matches the paper's threat model (§3.1): isolation of
  #    attacker/victim containers on distinct nodes
  securityContext:
    runAsUser: 1000             # non-root execution (UID 1000)
    runAsGroup: 1000            # non-root execution (GID 1000)
    runAsNonRoot: true          # mandatory requirement of the "restricted" Pod Security Standard level
    seccompProfile:
      type: RuntimeDefault      # limits allowed syscalls at the kernel level, required by "restricted"
  containers:
    - name: safe
      image: busybox:1.36              # minimal image
      command: ["sleep", "infinity"]   # test pod that stays active
      securityContext:
        allowPrivilegeEscalation: false   # forbids privilege escalation (required by "restricted")
        privileged: false                 # non-privileged container
        capabilities:
          drop: ["ALL"]                   # all Linux capabilities dropped (required by "restricted")