apiVersion: v1
kind: Pod
metadata:
  name: safe-pod
  namespace: safe-ns          # namespace victime, isolé de l'attaquant
spec:
  nodeName: k8s-w2             # worker séparé du worker attaquant
                                # -> conforme au threat model du papier (§3.1) : isolation des
                                #    containers attaquant/victime sur des nœuds distincts
  securityContext:
    runAsUser: 1000             # exécution non-root (UID 1000)
    runAsGroup: 1000            # exécution non-root (GID 1000)
    runAsNonRoot: true          # exigence obligatoire du niveau Pod Security Standard "restricted"
    seccompProfile:
      type: RuntimeDefault      # limite les syscalls autorisés au niveau kernel, requis par "restricted"
  containers:
    - name: safe
      image: busybox:1.36              # image minimale
      command: ["sleep", "infinity"]   # pod de test qui reste actif
      securityContext:
        allowPrivilegeEscalation: false   # interdit l'élévation de privilèges (requis "restricted")
        privileged: false                 # container non privilégié
        capabilities:
          drop: ["ALL"]                   # toutes les capabilities Linux retirées (requis "restricted")
